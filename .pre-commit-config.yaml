---
# .pre-commit-config.yaml
#
# Generated by assemble.sh on 2026-07-27T13:08:29Z
# Attributes: base security github scorecard
#
# https://pre-commit.com/hooks.html
repos:
  # Base hooks (include in every project)
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
        language_version: python3
        args: ['--allow-multiple-documents']
      - id: debug-statements
        language_version: python3
      - id: end-of-file-fixer
        language_version: python3
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: ['--branch', 'master', '--branch', 'main']
      - id: trailing-whitespace
        language_version: python3
      - id: requirements-txt-fixer
        language_version: python3

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # Trojan Source / dangerous Unicode detection
  - repo: local
    hooks:
      - id: trojan-source
        name: Detect Trojan Source (dangerous Unicode)
        entry: >-
          bash -c 'f=0; for file in "$@"; do
          if grep -Pq "[\x{202A}-\x{202E}\x{2066}-\x{2069}\x{200B}-\x{200D}\x{FEFF}\x{2060}]" "$file" 2>/dev/null; then
          echo "$file: dangerous Unicode (BIDI/zero-width)"; f=1; fi; done; exit $f' --
        language: system
        types: [text]

  # Commit message format (conventional commits — opt-in)
  # - repo: https://github.com/compilerla/conventional-pre-commit
  #   rev: v4.4.0
  #   hooks:
  #     - id: conventional-pre-commit
  #       stages: [commit-msg]
  #       args: [feat, fix, docs, style, refactor, test, chore, ci, build, perf, revert]

  # GitHub Actions — actionlint
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.11
    hooks:
      - id: actionlint

  # GitHub Actions — ensure SHA-pinned action references
  - repo: local
    hooks:
      - id: check-workflows-use-hashes
        name: Check GitHub Actions use SHA-pinned actions
        entry: >-
          bash -c 'f=0; for file in "$@"; do
          if grep -Pn "uses:\s+[^#]+@(?!([a-f0-9]{40}|v\d))" "$file" 2>/dev/null; then
          echo "$file: found action reference not pinned to SHA or version tag"; f=1; fi; done; exit $f' --
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        types: [file]

  - repo: local
    hooks:
      - id: scorecard
        name: OpenSSF Scorecard (full repo)
        entry: bash -c 'exec "$(git rev-parse --show-toplevel)/scripts/scorecard-pre-commit.sh"'
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

...
